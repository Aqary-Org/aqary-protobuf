syntax = "proto3";

package property_nd_unit.request;

option go_package = "/property_nd_unitpb;property_nd_unitpb";

import "google/protobuf/timestamp.proto";
import "property_nd_unit/address.proto";
import "property_nd_unit/common.proto";


message Agent {
  string ref_no = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
  string photo = 5;
}
message Plans {
  bool watermark = 1;
  string plan_type = 2;
  string url = 3;
}

// Photo for create request: matches JSON with url, watermark ("No"/"Yes"), type ("main"/"cover"), optional url_last_update.
message RequestPhoto {
  string url = 1;
  bool watermark = 2;  
  string gallery_type = 3;       // e.g. "main", "cover"
  google.protobuf.Timestamp url_last_update = 4;  // optional, e.g. "2026-02-10 13:53:20"
}



message CreatePropertyAndUnitRequest {
  bool is_property = 1;
  string ref_no = 2;
  string title = 3;
  string title_ar = 4;
  string description = 5;
  string description_ar = 6;
  string property_name = 7; 
  string status = 8;
  property_nd_unit.address.Address address = 9; 
  string agent_email = 12;
  repeated RequestPhoto photos = 13;
  string unit_types = 14;
  string property_type = 15 [json_name = "type"];
  int64 noofunits = 16 [json_name = "no_of_units"];
  string permit_number = 17;
  double price = 18;
  string category = 19;
  string listing_type = 20;
  string lifestyle = 21;
  string bedroom = 22;
  int64 bathroom = 23;
  int64 no_of_retails = 24;
  int64 no_of_payments = 25;
  string rent_type = 26;
  int64 no_of_elevators = 27;
  double built_up_area = 28;
  double plot_area = 29;
  string ownership = 30;
  string furnished = 31;
  int64 no_of_pools = 32;
  string completion_status = 33;
  google.protobuf.Timestamp handover_date = 34;
  double min_area = 35;
  double max_area = 36;
  string unit_of_measure = 37;
  string currency = 38;
  int64 no_of_floor = 39;
  string offering_type = 40;
  google.protobuf.Timestamp completion_date = 41;
  optional bool ask_price = 42;
  int64 parking = 43;
  google.protobuf.Timestamp permit_expiry_date = 44;
  float completion_percentage = 45;
  google.protobuf.Timestamp completion_percentage_date = 46;
  string facilities = 47;  // comma-separated, e.g. "Tennis court, Sauna, CCTV Security"
  string amenities = 48;   // comma-separated, e.g. "Furnished, Central A/C, Balcony"
  string views_text = 49;  // comma-separated, e.g. "Sea View, Marina View"
  property_nd_unit.common.UserDetail user_detail = 50;
}

message GetAllPropertyAndUnitRequest {
  int64 company_id = 1;
	int64 page_no = 2;
	int64 page_size = 3;
  int64 user_id = 4;
}

message CreatePropertyAndUnitRequestV2 {
  property_nd_unit.common.UserDetail user_detail = 1;
  string unit_number = 2;
  string note = 3;
  string title = 4;
  string title_ar = 5;
  string description = 6;
  string description_ar = 7;
  int64 category = 8;
  int64 listing_type = 9;
  int64 status = 10;
  int64 country_id = 11;
  int64 state_id = 12;
  int64 city_id = 13;
  int64 community_id = 14;
  int64 sub_community_id = 15;
  int64 geo_location_id = 16;
  string lat = 17;
  string lng = 18;
  repeated int64 facilities_id = 19;
  repeated int64 amenities_id = 20;
  string permit_number = 21;
  google.protobuf.Timestamp permit_expiry_date = 22;
  string permit_url = 23;
  int64 type_id = 24;
  repeated int64 unit_type_ids = 25;
  int64 property_id = 26;
  int64 entity_type = 27;
  int64 agent_id = 28;
  int64 company_id = 29;
  string bedroom = 30;
  int64 bathroom = 31;
  double plot_area = 32;
  double built_up_area  = 33;
  repeated string  views  = 34;
  string furnished  = 35;
  string life_style  = 36;
  google.protobuf.Timestamp completion_date  = 37;
  google.protobuf.Timestamp handover_date  = 38;
  int64 no_of_floor  = 39;
  int64 no_of_units  = 40;
  double min_area  = 41;
  double max_area  = 42;
  int64 parking  = 43;
  optional bool ask_price = 44;
  int64 no_of_retail  = 45;
  int64 no_of_pool  = 46;
  int64 elevator  = 47;
  string unit_of_measure = 48;
  double completion_percentage = 49;
  double price = 50;
  string rent_type = 51;
  int64 no_of_payment = 52;
  int64 completion_status = 53;
  string ownership = 54;
  int64 service_charge = 55;
  string currency_code = 56;
  string offering_type = 57;
}